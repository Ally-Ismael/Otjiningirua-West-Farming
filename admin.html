<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Otjiningirua West Farming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .header {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-form, .admin-panel {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .admin-panel {
            display: none;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eee;
        }
        .tab {
            padding: 1rem 2rem;
            background: #f8f9fa;
            border: none;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #2c5530;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        .card {
            background: #f8f9fa;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card h3 {
            color: #2c5530;
            margin-bottom: 0.5rem;
        }
        .card .status {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status.available {
            background: #d4edda;
            color: #155724;
        }
        .status.sold {
            background: #f8d7da;
            color: #721c24;
        }
        .card-actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        .video-upload {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            margin: 1rem 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .video-upload:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .video-upload.dragover {
            border-color: #667eea;
            background: #f0f8ff;
        }
        .alerts {
            margin-bottom: 1rem;
        }
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        .alert.success {
            background: #d4edda;
            color: #155724;
        }
        .alert.error {
            background: #f8d7da;
            color: #721c24;
        }
        @media (max-width: 768px) {
            .tabs {
                flex-direction: column;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐑 Otjiningirua West Farming - Admin Panel</h1>
            <p>Manage your ram and bean listings</p>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="login-form">
            <h2>Admin Login</h2>
            <div id="loginAlerts" class="alerts"></div>
            <form onsubmit="login(event)">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="admin-panel">
            <div class="tabs">
                <button class="tab active" onclick="showTab('rams')">Rams</button>
                <button class="tab" onclick="showTab('beans')">Beans</button>
                <button class="tab" onclick="showTab('inquiries')">Inquiries</button>
                <button class="tab" onclick="showTab('settings')">Settings</button>
                <button class="btn btn-danger" onclick="logout()" style="margin-left: auto;">Logout</button>
            </div>

            <!-- Rams Tab -->
            <div id="ramsTab" class="tab-content active">
                <h2>Ram Management</h2>
                <div id="ramAlerts" class="alerts"></div>
                
                <form id="ramForm" onsubmit="addRam(event)">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="ramName">Ram Name:</label>
                            <input type="text" id="ramName" required>
                        </div>
                        <div class="form-group">
                            <label for="ramBreed">Breed:</label>
                            <input type="text" id="ramBreed" required>
                        </div>
                        <div class="form-group">
                            <label for="ramAge">Age/Born:</label>
                            <input type="text" id="ramAge" placeholder="e.g., Nov 2022">
                        </div>
                        <div class="form-group">
                            <label for="ramWeight">Weight:</label>
                            <input type="text" id="ramWeight" placeholder="e.g., 45kg">
                        </div>
                        <div class="form-group">
                            <label for="ramColor">Color:</label>
                            <input type="text" id="ramColor">
                        </div>
                        <div class="form-group">
                            <label for="ramPrice">Price (N$):</label>
                            <input type="number" id="ramPrice" step="0.01">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="ramDescription">Description:</label>
                        <textarea id="ramDescription" rows="3"></textarea>
                    </div>

                    <div class="video-upload" onclick="document.getElementById('ramVideo').click()">
                        <p>📹 Click to upload video or drag & drop here</p>
                        <input type="file" id="ramVideo" accept="video/*" style="display: none;" onchange="handleVideoUpload(this, 'ramVideoPreview')">
                        <div id="ramVideoPreview"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="ramPhone">Contact Phone:</label>
                            <input type="tel" id="ramPhone" value="+264811220667">
                        </div>
                        <div class="form-group">
                            <label for="ramEmail">Contact Email:</label>
                            <input type="email" id="ramEmail" value="info@otjiningirua-west.com">
                        </div>
                    </div>

                    <button type="submit" class="btn">Add Ram</button>
                </form>

                <div id="ramsList" class="grid"></div>
            </div>

            <!-- Beans Tab -->
            <div id="beansTab" class="tab-content">
                <h2>Bean Management</h2>
                <div id="beanAlerts" class="alerts"></div>
                
                <form id="beanForm" onsubmit="addBean(event)">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="beanVariety">Bean Variety:</label>
                            <input type="text" id="beanVariety" required>
                        </div>
                        <div class="form-group">
                            <label for="beanQuantity">Quantity Available:</label>
                            <input type="number" id="beanQuantity" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="beanUnit">Unit:</label>
                            <select id="beanUnit" required>
                                <option value="kg">Kilograms (kg)</option>
                                <option value="tons">Tons</option>
                                <option value="bags">Bags</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="beanPricePerUnit">Price per Unit (N$):</label>
                            <input type="number" id="beanPricePerUnit" step="0.01" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="beanDescription">Description:</label>
                        <textarea id="beanDescription" rows="3"></textarea>
                    </div>

                    <div class="video-upload" onclick="document.getElementById('beanVideo').click()">
                        <p>📹 Click to upload video or drag & drop here</p>
                        <input type="file" id="beanVideo" accept="video/*" style="display: none;" onchange="handleVideoUpload(this, 'beanVideoPreview')">
                        <div id="beanVideoPreview"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="beanPhone">Contact Phone:</label>
                            <input type="tel" id="beanPhone" value="+264811220667">
                        </div>
                        <div class="form-group">
                            <label for="beanEmail">Contact Email:</label>
                            <input type="email" id="beanEmail" value="info@otjiningirua-west.com">
                        </div>
                    </div>

                    <button type="submit" class="btn">Add Bean Listing</button>
                </form>

                <div id="beansList" class="grid"></div>
            </div>

            <!-- Inquiries Tab -->
            <div id="inquiriesTab" class="tab-content">
                <h2>Customer Inquiries</h2>
                <div id="inquiriesList" class="grid"></div>
            </div>

            <!-- Settings Tab -->
            <div id="settingsTab" class="tab-content">
                <h2>Farm Settings</h2>
                <div id="settingsAlerts" class="alerts"></div>
                
                <form id="settingsForm" onsubmit="updateSettings(event)">
                    <div class="form-group">
                        <label for="farmPhone">Farm Phone:</label>
                        <input type="tel" id="farmPhone" value="+264811220667">
                    </div>
                    <div class="form-group">
                        <label for="farmEmail">Farm Email:</label>
                        <input type="email" id="farmEmail" value="info@otjiningirua-west.com">
                    </div>
                    <div class="form-group">
                        <label for="farmLocation">Farm Location:</label>
                        <input type="text" id="farmLocation" value="Otjiningirua West, Namibia">
                    </div>
                    <button type="submit" class="btn">Update Settings</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        // Login function
        async function login(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    currentUser = username;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadData();
                } else {
                    showAlert('loginAlerts', 'Invalid credentials', 'error');
                }
            } catch (error) {
                showAlert('loginAlerts', 'Login failed. Please try again.', 'error');
            }
        }

        // Logout function
        async function logout() {
            try {
                await fetch('/api/admin/logout', { method: 'POST' });
            } catch (error) {
                console.error('Logout error:', error);
            }
            
            currentUser = null;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Tab switching
        function showTab(tabName) {
            // Hide all tabs and remove active class
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab and add active class
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');

            // Load data for the selected tab
            if (tabName === 'rams') loadRams();
            if (tabName === 'beans') loadBeans();
            if (tabName === 'inquiries') loadInquiries();
        }

        // Load all data
        function loadData() {
            loadRams();
            loadBeans();
            loadInquiries();
        }

        // Add Ram
        async function addRam(event) {
            event.preventDefault();
            
            const ramData = {
                name: document.getElementById('ramName').value,
                breed: document.getElementById('ramBreed').value,
                bornDate: document.getElementById('ramAge').value,
                weightKg: document.getElementById('ramWeight').value,
                color: document.getElementById('ramColor').value,
                price: parseFloat(document.getElementById('ramPrice').value),
                description: document.getElementById('ramDescription').value,
                phone: document.getElementById('ramPhone').value,
                email: document.getElementById('ramEmail').value,
                healthStatus: 'Excellent',
                bloodline: 'Premium'
            };

            try {
                const response = await fetch('/api/admin/rams', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ramData)
                });

                if (response.ok) {
                    showAlert('ramAlerts', 'Ram added successfully!', 'success');
                    document.getElementById('ramForm').reset();
                    loadRams();
                } else {
                    showAlert('ramAlerts', 'Failed to add ram', 'error');
                }
            } catch (error) {
                showAlert('ramAlerts', 'Error adding ram', 'error');
            }
        }

        // Add Bean
        async function addBean(event) {
            event.preventDefault();
            
            const beanData = {
                name: document.getElementById('beanVariety').value,
                variety: document.getElementById('beanVariety').value,
                pricePerKg: parseFloat(document.getElementById('beanPricePerUnit').value),
                description: document.getElementById('beanDescription').value,
                phone: document.getElementById('beanPhone').value,
                email: document.getElementById('beanEmail').value
            };

            try {
                const response = await fetch('/api/admin/beans', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(beanData)
                });

                if (response.ok) {
                    showAlert('beanAlerts', 'Bean listing added successfully!', 'success');
                    document.getElementById('beanForm').reset();
                    loadBeans();
                } else {
                    showAlert('beanAlerts', 'Failed to add bean listing', 'error');
                }
            } catch (error) {
                showAlert('beanAlerts', 'Error adding bean listing', 'error');
            }
        }

        // Load Rams
        async function loadRams() {
            try {
                const response = await fetch('/api/rams');
                const rams = await response.json();
                
                const ramsList = document.getElementById('ramsList');
                ramsList.innerHTML = rams.map(ram => `
                    <div class="card">
                        <h3>${ram.name}</h3>
                        <p><strong>Breed:</strong> ${ram.breed || 'N/A'}</p>
                        <p><strong>Born:</strong> ${ram.bornDate || 'N/A'}</p>
                        <p><strong>Weight:</strong> ${ram.weightKg || 'N/A'}</p>
                        <p><strong>Color:</strong> ${ram.color || 'N/A'}</p>
                        <p><strong>Price:</strong> N$${ram.price || 'N/A'}</p>
                        <span class="status ${ram.status || 'available'}">${(ram.status || 'available').toUpperCase()}</span>
                        <div class="card-actions">
                            <button class="btn" onclick="deleteRam('${ram.id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading rams:', error);
            }
        }

        // Load Beans
        async function loadBeans() {
            try {
                const response = await fetch('/api/beans');
                const beans = await response.json();
                
                const beansList = document.getElementById('beansList');
                beansList.innerHTML = beans.map(bean => `
                    <div class="card">
                        <h3>${bean.name || bean.variety}</h3>
                        <p><strong>Variety:</strong> ${bean.variety || 'N/A'}</p>
                        <p><strong>Price per kg:</strong> N$${bean.pricePerKg || 'N/A'}</p>
                        <p><strong>Description:</strong> ${bean.description || 'N/A'}</p>
                        <span class="status ${bean.status || 'available'}">${(bean.status || 'available').toUpperCase()}</span>
                        <div class="card-actions">
                            <button class="btn btn-danger" onclick="deleteBean('${bean.id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading beans:', error);
            }
        }

        // Load Inquiries
        async function loadInquiries() {
            // Since inquiries endpoint might not exist yet, we'll create a placeholder
            const inquiriesList = document.getElementById('inquiriesList');
            inquiriesList.innerHTML = `
                <div class="card">
                    <h3>Customer Inquiries</h3>
                    <p>Inquiries will appear here when customers submit the contact form.</p>
                    <p>Check your email and WhatsApp for direct messages from customers.</p>
                </div>
            `;
        }

        // Delete Ram
        async function deleteRam(id) {
            if (confirm('Are you sure you want to delete this ram?')) {
                try {
                    await fetch(`/api/admin/rams/${id}`, { method: 'DELETE' });
                    loadRams();
                    showAlert('ramAlerts', 'Ram deleted successfully', 'success');
                } catch (error) {
                    showAlert('ramAlerts', 'Error deleting ram', 'error');
                }
            }
        }

        // Delete Bean
        async function deleteBean(id) {
            if (confirm('Are you sure you want to delete this bean listing?')) {
                try {
                    await fetch(`/api/admin/beans/${id}`, { method: 'DELETE' });
                    loadBeans();
                    showAlert('beanAlerts', 'Bean listing deleted successfully', 'success');
                } catch (error) {
                    showAlert('beanAlerts', 'Error deleting bean listing', 'error');
                }
            }
        }

        // Update Settings
        async function updateSettings(event) {
            event.preventDefault();
            showAlert('settingsAlerts', 'Settings updated successfully!', 'success');
        }

        // Handle video upload
        function handleVideoUpload(input, previewId) {
            const file = input.files[0];
            if (file) {
                const preview = document.getElementById(previewId);
                preview.innerHTML = `<p>✅ Video selected: ${file.name}</p>`;
            }
        }

        // Show alert
        function showAlert(containerId, message, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="alert ${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Drag and drop for video uploads
        document.addEventListener('DOMContentLoaded', function() {
            const videoUploads = document.querySelectorAll('.video-upload');
            videoUploads.forEach(upload => {
                upload.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    upload.classList.add('dragover');
                });
                
                upload.addEventListener('dragleave', () => {
                    upload.classList.remove('dragover');
                });
                
                upload.addEventListener('drop', (e) => {
                    e.preventDefault();
                    upload.classList.remove('dragover');
                    // Handle file drop logic here
                });
            });
        });
    </script>
</body>
</html>
