<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rams - Otjiningirua West</title>
	<link rel="stylesheet" href="/css/styles.css">
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 16px; }
		.card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 2px solid #eee; }
		.card h3 { margin: 8px 0; color: #2c5530; font-size: 1rem; }
		.badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
		.badge.available { background: #e8f5e9; color: #2e7d32; }
		.badge.reserved { background: #fff8e1; color: #ff8f00; }
		.badge.sold { background: #ffebee; color: #c62828; }
		.thumb { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; background: #f3f4f6; }
		.actions { display:flex; gap:8px; margin-top: 10px; }
		.actions a, .actions button { flex:1; text-align:center; }
		.cta-button {
			display: inline-block;
			background: linear-gradient(45deg, #667eea, #764ba2);
			color: white;
			padding: 0.5rem 1rem;
			text-decoration: none;
			border-radius: 25px;
			font-weight: bold;
			font-size: 0.9rem;
			transition: all 0.3s ease;
			border: none;
			cursor: pointer;
		}
		.cta-button:hover {
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(0,0,0,0.2);
		}
		@media (max-width: 768px) {
			.grid { grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; }
			.card { padding: 10px; }
			.card h3 { font-size: 0.9rem; }
			.thumb { height: 120px; }
			.cta-button { font-size: 0.8rem; padding: 0.4rem 0.8rem; }
			#zoomModal button { font-size: 1.2rem; padding: 0.6rem 1rem; }
		}
		@media (max-width: 480px) {
			.grid { grid-template-columns: 1fr; }
			.card { padding: 8px; }
			.thumb { height: 100px; }
		}
	</style>
</head>
<body>
	<header>
		<nav class="container">
			<div class="logo">🐑 Otjiningirua West Farming</div>
			<ul class="nav-links">
				<li><a href="/">Home</a></li>
				<li><a href="/rams.html">Rams</a></li>
				<li><a href="/beans.html">Beans</a></li>
			</ul>
		</nav>
	</header>
	<main class="container" style="padding: 24px;">
		<h1 class="section-title" style="margin-top: 20px;">Ram Lots</h1>
		<div id="grid" class="grid"></div>
		<div id="lotDetails" style="display:none;">
			<button onclick="showGrid()" class="mb-4 bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">← Back to Lots</button>
			<div id="detailsContent"></div>
		</div>
	</main>
	<div id="zoomModal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.9);">
		<span onclick="closeZoom()" style="position:absolute; top:10px; right:10px; color:white; font-size:30px; cursor:pointer;">&times;</span>
		<div style="display:flex; justify-content:center; align-items:center; height:100%;">
			<img id="zoomImage" src="" style="max-width:90%; max-height:90%; transform:scale(1); transition:transform 0.3s;">
		</div>
		<div style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%);">
			<button onclick="zoomIn()" class="bg-white text-black px-4 py-2 mx-2 rounded">+</button>
			<button onclick="zoomOut()" class="bg-white text-black px-4 py-2 mx-2 rounded">-</button>
			<button onclick="resetZoom()" class="bg-white text-black px-4 py-2 mx-2 rounded">Reset</button>
		</div>
	</div>
	
	<!-- Video Modal -->
	<div id="videoModal" style="display:none; position:fixed; z-index:1001; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.9);">
		<span onclick="closeVideoModal()" style="position:absolute; top:10px; right:10px; color:white; font-size:30px; cursor:pointer; z-index:1002;">&times;</span>
		<div style="display:flex; justify-content:center; align-items:center; height:100%; padding:20px;">
			<video id="modalVideo" controls style="max-width:90%; max-height:90%; border-radius:8px;">
				<source id="modalVideoSource" src="" type="video/mp4">
				<source id="modalVideoSourceMov" src="" type="video/quicktime">
				Your browser does not support the video tag.
			</video>
		</div>
	</div>
	<script>
		const CALL_NO = '+264811220667';
		const WA_NO = '264811220667';
		let rams = [];
		function statusClass(s){ return s==='available'?'available':s==='reserved'?'reserved':'sold'; }
		function firstImage(r){
			const img = (r.media||[]).find(m=>m.type==='image');
			return img?.url || '';
		}
		function firstVideo(r){
			const vid = (r.media||[]).find(m=>m.type==='video');
			return vid?.url || '';
		}
		async function load(){
			try {
				rams = await fetch('/api/rams').then(r=>r.json());
			} catch (e) {
				rams = [];
			}
			const el = document.getElementById('grid');
			el.innerHTML = rams.map(r=>{
				const media = firstImage(r);
				return `
					<div class="card" onclick="showDetails('${r.id}')">
						${media? `<img class=\"thumb\" src=\"${media}\" alt=\"${r.name||'Ram'}\">`:`<div class=\"thumb\"></div>`}
						<h3>${r.name||'Ram'}</h3>
						<div class="badge ${statusClass(r.status)}">${(r.status||'available').toUpperCase()}</div>
						<div class="actions">
							<a class="cta-button" href="tel:${CALL_NO}">Call</a>
							<a class="cta-button" target="_blank" href="https://wa.me/${WA_NO}?text=${encodeURIComponent('Hi, I am interested in ' + (r.name||r.id))}">WhatsApp</a>
						</div>
					</div>
				`;
			}).join('');
			const hash = window.location.hash;
			if (hash.startsWith('#lot')) {
				const id = hash.substring(4);
				const lot = rams.find(l=>String(l.id)===String(id));
				if(lot) showLotDetails(lot);
			}
		}
		function showDetails(id){
			const lot = rams.find(l=>String(l.id)===String(id));
			if(!lot) return;
			window.location.hash = 'lot' + id;
			showLotDetails(lot);
		}
		function showLotDetails(lot){
			const grid = document.getElementById('grid');
			const details = document.getElementById('lotDetails');
			const content = document.getElementById('detailsContent');
			grid.style.display = 'none';
			details.style.display = 'block';
			const images = (lot.media||[]).filter(m=>m.type==='image').map(m=>m.url);
			const video = firstVideo(lot);
			content.innerHTML = `
				<div class="bg-green-700 text-center py-3 mb-4">
					<h2 class="text-white font-bold text-lg">${lot.name||'Ram'}</h2>
				</div>
				<div class="flex justify-center mb-4">
					<img src="${images[0] || ''}" alt="${lot.name||'Ram'}" class="rounded-md shadow-md max-h-48 md:max-h-64 object-cover cursor-pointer" onclick="openZoom('${images[0] || ''}')">
				</div>
				<div class="flex justify-center mb-4">
					<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">
						${(lot.status||'available').charAt(0).toUpperCase() + (lot.status||'available').slice(1)}
					</span>
				</div>
				<div class="grid grid-cols-1 md:grid-cols-2 gap-3 p-4 text-gray-700 text-sm mb-4">
					<div class="bg-gray-100 p-2 rounded-md"><strong>Born:</strong> ${lot.bornDate||'-'}</div>
					<div class="bg-gray-100 p-2 rounded-md"><strong>Weight:</strong> ${lot.weightKg? (lot.weightKg+' kg'):'-'}</div>
					<div class="bg-gray-100 p-2 rounded-md"><strong>Color:</strong> ${lot.color||'-'}</div>
					<div class="bg-gray-100 p-2 rounded-md"><strong>Health Status:</strong> ${lot.healthStatus||'-'}</div>
					<div class="bg-gray-100 p-2 rounded-md"><strong>Bloodline:</strong> ${lot.bloodline||'-'}</div>
				</div>
				<div class="px-4 mb-4">
					<h3 class="text-gray-800 font-semibold mb-2">📸 Media Gallery</h3>
					<div class="flex gap-2 flex-wrap">${images.map(img=>`<img src="${img}" class="w-24 h-24 md:w-32 md:h-32 rounded-lg object-cover cursor-pointer" onclick="openZoom('${img}')">`).join('')}</div>
				</div>
				<div class="px-4 mb-4">
					<h3 class="text-gray-800 font-semibold mb-2">🎥 Video</h3>
					<div class="flex justify-center">
						${video ? `<div class="relative cursor-pointer" onclick="openVideoModal('${video}')">
							<video class="w-24 h-24 md:w-32 md:h-32 rounded-lg object-cover pointer-events-none" style="background: #f3f4f6;" muted>
								<source src="${video}" type="video/mp4">
								<source src="${video}" type="video/quicktime">
							</video>
							<div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 rounded-lg hover:bg-opacity-50 transition-all">
								<div class="w-8 h-8 md:w-10 md:h-10 bg-white bg-opacity-80 rounded-full flex items-center justify-center">
									<svg class="w-4 h-4 md:w-5 md:h-5 text-gray-800 ml-1" fill="currentColor" viewBox="0 0 20 20">
										<path d="M6.5 5.5v9l7-4.5-7-4.5z"/>
									</svg>
								</div>
							</div>
						</div>` : `<div class="w-24 h-24 md:w-32 md:h-32 bg-gray-100 rounded-lg flex items-center justify-center text-gray-500 text-xs">No video available</div>`}
					</div>
				</div>
				<div class="text-center mt-4 mb-4">
					<p class="text-red-500 font-medium mb-2">📞 Interested in this ram?</p>
					<div class="flex justify-center gap-4">
						<a href="https://wa.me/${WA_NO}?text=${encodeURIComponent('Hi, I am interested in ' + (lot.name||lot.id))}" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg shadow">WhatsApp Us</a>
						<a href="tel:${CALL_NO}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg shadow">Call Now</a>
					</div>
				</div>
			`;
		}
		function showGrid(){
			window.location.hash = '';
			const grid = document.getElementById('grid');
			const details = document.getElementById('lotDetails');
			grid.style.display = 'grid';
			details.style.display = 'none';
		}
		let currentScale = 1;
		function openZoom(src){
			document.getElementById('zoomImage').src = src;
			document.getElementById('zoomModal').style.display = 'block';
			currentScale = 1;
			document.getElementById('zoomImage').style.transform = 'scale(1)';
		}
		function closeZoom(){
			document.getElementById('zoomModal').style.display = 'none';
		}
		function zoomIn(){
			currentScale += 0.2;
			document.getElementById('zoomImage').style.transform = `scale(${currentScale})`;
		}
		function zoomOut(){
			if(currentScale > 0.2){
				currentScale -= 0.2;
				document.getElementById('zoomImage').style.transform = `scale(${currentScale})`;
			}
		}
		function resetZoom(){
			currentScale = 1;
			document.getElementById('zoomImage').style.transform = 'scale(1)';
		}
		
		// Video Modal Functions
		function openVideoModal(videoSrc){
			const modal = document.getElementById('videoModal');
			const video = document.getElementById('modalVideo');
			const sourceMp4 = document.getElementById('modalVideoSource');
			const sourceMov = document.getElementById('modalVideoSourceMov');
			
			// Set video sources
			sourceMp4.src = videoSrc;
			sourceMov.src = videoSrc;
			
			// Load and show modal
			video.load();
			modal.style.display = 'block';
			
			// Auto-play when modal opens
			setTimeout(() => {
				video.play().catch(e => console.log('Auto-play prevented:', e));
			}, 100);
		}
		
		function closeVideoModal(){
			const modal = document.getElementById('videoModal');
			const video = document.getElementById('modalVideo');
			
			// Pause and hide modal
			video.pause();
			video.currentTime = 0;
			modal.style.display = 'none';
		}
		load();
		
		// Video error handling
		document.addEventListener('DOMContentLoaded', function() {
			document.addEventListener('error', function(e) {
				if (e.target && e.target.tagName === 'VIDEO') {
					const video = e.target;
					const container = video.parentElement;
					container.innerHTML = '<div class="w-full h-32 md:h-48 bg-red-50 border border-red-200 rounded-lg flex items-center justify-center text-red-600 text-sm"><div class="text-center"><div>⚠️ Video failed to load</div><div class="mt-2"><a href="' + video.querySelector('source').src + '" download class="underline">Download video</a></div></div></div>';
				}
			}, true);
		});
		
		window.addEventListener('hashchange', function() {
			const hash = window.location.hash;
			if (hash.startsWith('#lot')) {
				const id = hash.substring(4);
				const lot = rams.find(l=>String(l.id)===String(id));
				if(lot) showLotDetails(lot);
				else showGrid();
			} else {
				showGrid();
			}
		});
		
		// Keyboard support for modals
		document.addEventListener('keydown', function(e) {
			if (e.key === 'Escape') {
				if (document.getElementById('videoModal').style.display === 'block') {
					closeVideoModal();
				} else if (document.getElementById('zoomModal').style.display === 'block') {
					closeZoom();
				}
			}
		});
	</script>
</body>
<a class="whatsapp-float" href="https://wa.me/264811220667" target="_blank" aria-label="Chat on WhatsApp" title="Chat on WhatsApp">

</a>
</html>
